id: bitrix-cache-key-literal
language: php
severity: warning
message: "Ключ кэша — строковый литерал без контекста. Для персонального/регионального контента это утечка между пользователями."
note: >
  Если результат зависит от региона, типа цены, группы пользователя, страницы или сортировки — всё это ОБЯЗАНО
  входить в ключ кэша. Иначе один пользователь увидит цены другого региона (или чужие персональные данные).
  Правильно: $cacheId = 'catalog_' . $sectionId . '_' . $regionId . '_' . $priceTypeId . '_' . SITE_ID;
  Если контент действительно общий — можно оставить литерал (это осознанный выбор).
  См. skills/bitrix-performance/references/caching.md
rule:
  any:
    - pattern: $C->initCache($T, "$KEY", $$$)
    - pattern: $C->InitCache($T, "$KEY", $$$)
