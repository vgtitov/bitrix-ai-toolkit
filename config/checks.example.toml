# checks.example.toml — ОПЦИОНАЛЬНОСТЬ ПРОВЕРОК. Скопируй в config/checks.toml (или config/local/checks.toml).
#
# Философия (по итогам встречи): проверки НЕ должны ухудшать жизнь разработчику. Поэтому:
#   • по умолчанию режим МЯГКИЙ — warn (показывает проблему, но НЕ блокирует коммит/работу);
#   • каждый настраивает под СЕБЯ и гоняет только на СВОИХ путях, не навязывая команде;
#   • нет конфига → безопасные дефолты; инструмент не установлен → проверка тихо пропускается (не падает).
#
# Приоритет источников режима: env BITRIX_AI_CHECKS  >  config/local/checks.toml  >  config/checks.toml  >  дефолт(warn).
# Быстрый глобальный выключатель: BITRIX_AI_CHECKS=off  (или mode.default = "off").

[mode]
# off   — не запускать проверку вовсе
# warn  — запустить, показать находки, НО не блокировать (exit 0)  ← дефолт, безопасно
# block — запустить и блокировать при находках (exit 1) — для тех, кто хочет строгий гейт на СВОём коде
default = "warn"

# Точечные переопределения по проверкам (пусто = наследует mode.default):
[checks.phpstan]
enabled = true
# mode = "warn"

[checks.php_cs_fixer]
enabled = true      # авто-формат безопасен, но тоже опционален
# mode = "warn"

[checks.ast_grep]
enabled = true
# mode = "warn"

[checks.n1_guard]
enabled = true
# mode = "block"    # хочешь жёстко ловить N+1 на СВОих коммитах — поставь block

[scope]
# Гонять проверки ТОЛЬКО на этих путях (чтобы не трогать чужой/командный/легаси-код).
paths = ["local/"]
exclude = ["*/vendor/*", "*/legacy/*", "*/bitrix/*"]
