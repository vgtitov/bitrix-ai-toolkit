# version-stack.example.toml — версионный стек проекта (ЛОКАЛИЗАЦИЯ).
# Скопируй в свой файл (напр. config/version-stack.toml) и заполни под ПРОЕКТ. Путь можно указать агенту/скиллам.
# Смысл: агент и линтеры должны знать ТОЧНЫЕ версии, чтобы писать корректно — не предлагать API, которого нет в
# твоей версии ядра, и не использовать устаревшее там, где уже есть замена; и наоборот — использовать legacy-API там,
# где D7-обёртки ещё нет (иначе не заработает).

[php]
# Версия PHP окружения. Современный Битрикс: 8.2 или 8.3. С 01.02.2026 обновления BUS недоступны на PHP < 8.2.
version = "8.3"
# Rector/PHPStan таргетируются на эту версию: не предлагать синтаксис новее, чем доступно.

[bitrix]
edition = "business"          # start | standard | small_business | business | enterprise
main_version = "24.x"         # версия главного модуля (см. Обновление системы → текущая версия)
# Ключевой механизм проверки версий: путь к РЕАЛЬНОМУ ядру ТВОЕЙ версии для scanDirectories PHPStan.
# PHPStan сам ругается «метода нет в этой версии», а phpstan-deprecation-rules — на устаревшее (@deprecated в ядре).
core_path = "bitrix/modules"
# Ядро правлено (не эталонный дистрибутив)? Тогда анализ и сигнатуры — по ФАКТИЧЕСКОМУ коду, а не по докам вендора.
# Агент помечает такие места [правлено ядро]. Подробно — skills/bitrix-dev/references/custom-core.md
core_modified = false
core_patches = "patches/core" # где лежат .patch и REGISTRY.md правок ядра (если core_modified = true)

[modules]
# Версии ключевых модулей — API отличается между версиями. Заполни фактические (из admin → Обновление системы).
main = "24.x"
iblock = "24.x"
catalog = "24.x"
sale = "24.x"
highloadblock = "24.x"

# ─────────────────────────────────────────────────────────────────────────────
# ЧУЖОЕ КАСТОМНОЕ ЯДРО / СВОЙ ФРЕЙМВОРК ПОВЕРХ БИТРИКС
# Частая реальность: подрядчик или предыдущая команда вынесли существенную часть функционала
# в собственный слой со своим namespace, и «ядро Битрикс» там почти не используется.
# Тогда источник правды по API — ИХ код, а не документация Битрикс.
# Агент обязан искать в ТРЁХ слоях: кастомный слой → ядро Битрикс → /local.
[[custom_layers]]
name = "vendor-framework"        # произвольное имя слоя (для сообщений агента)
namespace = "Acme\\"             # PSR-4 namespace слоя (экранируй обратный слэш)
path = "local/vendor-framework"  # путь к коду слоя (попадёт в scanDirectories PHPStan и в поиск)
share = "30-35%"                 # доля функционала — чтобы агент понимал масштаб
docs = ""                        # ссылка/путь к их документации, если есть; пусто — читать код
priority = "over-bitrix"         # over-bitrix: их методы предпочтительнее битриксовых
                                 # under-bitrix: битриксовые предпочтительнее, их — legacy
# Несколько слоёв — просто добавь ещё блоков [[custom_layers]].

[conventions]
# Целевой стиль ядра для нового кода.
new_code_core = "D7"          # новый код — на D7 (Bitrix\Main\*, *Table::getList)
code_standard = "PSR-12"
# Где D7-обёрток НЕТ и вынужденно используем старое ядро (укажи под проект — чтобы линтер не «правил» это на D7):
legacy_required = [
    "sale: оформление заказа, скидки, правила корзины (часть API только в C*-классах)",
    "catalog: часть операций с ценами/складами",
]
# Свои префиксы/неймспейсы PSR-4:
psr4_namespace = "Local\\"
psr4_path = "local/classes"
