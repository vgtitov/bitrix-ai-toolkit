# Центральный (общий для команды) сервис проверок Битрикс-кода — ОПЦИОНАЛЬНО.
# Локальный путь всегда работает без Docker; это ускорение для команды: единая версия линтеров у всех и в CI.
#
# Запуск:   docker compose -f docker/docker-compose.yml run --rm checks
# Проверить конкретный путь: docker compose -f docker/docker-compose.yml run --rm checks check local/
#
# Переменные (окружение или .env рядом с этим файлом):
#   PROJECT_DIR       — ОБЯЗАТЕЛЬНО: АБСОЛЮТНЫЙ путь к проекту Битрикс на хосте (монтируется в /work).
#                       ⚠️ Относительные пути в compose резолвятся от каталога docker/, а НЕ от того,
#                       откуда ты запускаешь команду — поэтому значение по умолчанию тут опасно
#                       (смонтировался бы чужой каталог). Задавай явно:
#                          PROJECT_DIR=$(pwd) docker compose -f docker/docker-compose.yml run --rm checks
#   BITRIX_AI_CHECKS  — режим проверок: off | warn | block (по умолчанию warn — не блокирует).
#   CHECKS_CONFIG     — АБСОЛЮТНЫЙ путь к своему checks.toml (опционально).
services:
  checks:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bitrix-ai-toolkit/checks:latest
    volumes:
      # Код проекта. Без PROJECT_DIR compose остановится с понятной ошибкой — это осознанно:
      # лучше явная ошибка, чем молча проверить не тот каталог.
      - "${PROJECT_DIR:?укажи АБСОЛЮТНЫЙ путь к проекту, напр. PROJECT_DIR=$(pwd)}:/work"
    environment:
      BITRIX_AI_CHECKS: "${BITRIX_AI_CHECKS:-warn}"
    working_dir: /work
    # Разовый прогон, не демон
    restart: "no"
